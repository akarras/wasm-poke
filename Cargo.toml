[package]
name = "wasm-poke"
version = "0.1.0"
edition = "2021"


[workspace]
members = ["fixtures/simple-wasm"]

[features]
default = []
fixture-tests = []

[dependencies]
wasmparser = "0.205"
rustc-demangle = "0.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
