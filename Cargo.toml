[package]
name = "wasm-poke"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
codegen-units = 1

[workspace]
members = ["fixtures/simple-wasm"]

[features]
default = []
fixture-tests = []

[dependencies]
wasmparser = "0.241.2"
rustc-demangle = "0.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29.0"
crossterm = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
addr2line = "0.25.1"
object = { version = "0.37.3", features = ["read", "wasm"] }
gimli = { version = "0.32.3", features = ["read"] }
globset = "0.4"
