[package]
name = "wasm-poke"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
codegen-units = 1

[profile.release-debug]
inherits = "release"
debug = true

[workspace]
members = ["tests/fixtures/*"]

[features]
default = []
fixture-tests = []

[dependencies]
# Analysis dependencies
wasmparser = "0.241.2"
rustc-demangle = "0.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
addr2line = "0.25.1"
object = { version = "0.37.3", features = ["read", "wasm"] }
gimli = { version = "0.32.3", features = ["read"] }
globset = "0.4"

# GUI dependencies
eframe = { version = "0.33", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
] }
egui_dock = "0.18"
rfd = "0.17"
log = "0.4"
bytesize = "1.3"
egui_extras = "0.33"

# Native-only
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
